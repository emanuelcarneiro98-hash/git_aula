<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>About Us</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; font-family: Arial, sans-serif; line-height: 1.6; color: #263247; background: #f4f6f9; }
		header, footer { padding: 1rem 8%; background: #263247; color: white; }
		nav { display: flex; justify-content: space-between; align-items: center; }
		nav a { margin-left: 1rem; color: white; text-decoration: none; }
		main { max-width: 900px; margin: 3rem auto; padding: 0 1.5rem; }
		section { margin-bottom: 2rem; }
		.intro, .card { padding: 1.5rem; border-radius: 10px; background: white; }
		.team { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
		.portrait { height: 110px; border-radius: 8px; background: #e4e9f0; }
		footer { text-align: center; }
	</style>
</head>
<body>
	<header>
		<nav aria-label="Main navigation">
			<strong>Company Name</strong>
			<div><a href="index.html">Home</a><a href="about.html">About</a><a href="#contact">Contact</a></div>
		</nav>
	</header>
	<main>
		<section class="intro">
			<h1>About Us</h1>
			<p>We’re a team creating thoughtful solutions for our community. Learn about our story, values, and the people behind our work.</p>
		</section>
		<section aria-labelledby="team-title">
			<h2 id="team-title">Meet the Team</h2>
			<div class="team">
				<article class="card"><div class="portrait" aria-hidden="true"></div><h3>Alex Morgan</h3><p>Founder</p></article>
				<article class="card"><div class="portrait" aria-hidden="true"></div><h3>Jamie Lee</h3><p>Designer</p></article>
				<article class="card"><div class="portrait" aria-hidden="true"></div><h3>Casey Taylor</h3><p>Developer</p></article>
			</div>
		</section>
	</main>
	<footer id="contact">Contact us: hello@example.com</footer>
</body>
</html>
